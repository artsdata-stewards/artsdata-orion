name: Fetch lecarre150-com Events

on:
  workflow_dispatch:
  schedule:
    - cron: '20 11 * * 2'
  
jobs:
  artsdata-fetch-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Action setup
        uses: culturecreates/artsdata-pipeline-action@v4
        with:
          mode: "fetch-push"
          artifact: "lecarre150-com"
          publisher: "https://github.com/fjjulien#this"
          page-url: "https://lecarre150.com/sitemap.xml"
          entity-identifier: "loc"
          token: "${{ secrets.GITHUB_TOKEN }}"
          cloudflare-private-key: ${{ secrets.CLOUDFLARE_PRIVATE_KEY }}
          html-extract-config: |
            {
              "entity_type": "http://schema.org/Event",
              "extract": {
                "http://schema.org/additionalType": {
                  "xpath": "normalize-space(//div[@class='c-single-event__category'])",
                  "array": "true"
                }
              }
            }
