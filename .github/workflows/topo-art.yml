name: Fetch topo-art Events
# https://github.com/artsdata-stewards/source-logs/issues/50

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
      
jobs:
  artsdata-fetch-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Action setup
        uses: culturecreates/artsdata-pipeline-action@v4
        with:
          mode: "fetch-push"
          artifact: "topo-art"
          publisher: "https://github.com/fjjulien#this"
          page-url: "https://topo.art/programmation-sitemap.xml"
          entity-identifier: "loc"
          is-paginated: "false"
          token: "${{ secrets.GITHUB_TOKEN }}"
          cloudflare-private-key: ${{ secrets.CLOUDFLARE_PRIVATE_KEY }}
